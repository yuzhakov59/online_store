{% extends 'catalog/base.html' %}

{% block title %}Описание{% endblock %}

{% block content %}
<div class="container">
    <div class="row text-center">
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ object.name }}</h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">{{ object.price }} руб.</h1>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- {{ object.description }}</li>
                    </ul>
                    <button type="button" class="p-2 btn btn-lg btn-block btn-outline-primary">Купить</button>
                    <a class="p-2 btn btn-lg btn-block btn-outline-primary" href="{% url 'catalog:catalog_list' %}">Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
